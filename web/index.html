<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>线索数据总览</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header class="top"><div class="top-inner"><span class="brand">线索数据</span><span class="top-note">本地数据看板</span></div></header>
<main><section class="intro"><div><h1>批次数据监控</h1></div></section>
<section class="filters" aria-labelledby="filter-title"><div class="section-head"><div><h2 id="filter-title">筛选数据</h2></div><button type="button" id="reset" class="text-button">重置筛选</button></div><form id="filters"><label>开始日期<input name="start" type="date"></label><label>结束日期<input name="end" type="date"></label><label>学部<select name="学部"><option value="">全部学部</option></select></label><label>流量期次<select name="流量期次"><option value="">全部期次</option></select></label><label>外呼池<select name="外呼池"><option value="">全部外呼池</option></select></label><label>线索批次<select name="线索批次"><option value="">全部批次</option></select></label><button class="primary" type="submit">查看结果</button></form><p id="error" class="error" role="alert"></p></section>
<section class="overview" aria-labelledby="overview-title"><div class="section-head"><div><h2 id="overview-title">核心指标</h2></div><span id="count" class="muted"></span></div><div class="metrics" id="metrics"></div><p class="note">指标根据筛选结果重新计算；数据缺失或分母为零时显示“—”。两来源覆盖范围可能不同，请结合明细核对。</p></section>
<section class="details" aria-labelledby="detail-title"><div class="section-head"><div><h2 id="detail-title">关联明细</h2></div><span class="muted">按日期及业务维度关联</span></div><div class="table-wrap" tabindex="0" aria-label="关联明细表，可横向滚动"><table><thead><tr><th>日期</th><th>学部</th><th>流量期次</th><th>外呼池</th><th>线索批次</th><th>关联状态</th><th>例子量</th><th>接通转化率</th><th>有课例产</th><th>单例子结算成本</th><th>北A</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty" hidden>当前条件下没有数据。请调整筛选，或先通过命令行导入数据。</div><div class="pagination"><button id="prev" type="button">上一页</button><span id="page"></span><button id="next" type="button">下一页</button></div></section></main><footer>数据保存在本机 · 口径与关联范围请结合来源核对</footer></body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>线索数据总览</title><link rel="stylesheet" href="/ui.css"><link rel="stylesheet" href="/style.css"><script type="module" src="/ui.js"></script><script src="/app.js" defer></script></head>
<body><header class="top"><div class="top-inner"><span class="brand">线索数据</span><span class="top-note">本地数据看板</span></div></header>
<main><section class="intro"><div><h1>批次数据监控</h1></div></section>
<section class="filters" aria-labelledby="filter-title"><div class="section-head"><div><h2 id="filter-title">筛选数据</h2></div><button type="button" id="reset" class="text-button">重置筛选</button></div><form id="filters"><div class="field-wrap"><input id="native-start" name="start" type="hidden"><div data-control="native-start" data-label="开始日期"></div></div><div class="field-wrap"><input id="native-end" name="end" type="hidden"><div data-control="native-end" data-label="结束日期"></div></div><div class="field-wrap"><select id="native-学部" name="学部" hidden tabindex="-1" aria-hidden="true"><option value="">全部学部</option></select><div data-control="native-学部" data-label="学部"></div></div><div class="field-wrap"><select id="native-流量期次" name="流量期次" hidden tabindex="-1" aria-hidden="true"><option value="">全部期次</option></select><div data-control="native-流量期次" data-label="流量期次"></div></div><div class="field-wrap"><select id="native-外呼池" name="外呼池" hidden tabindex="-1" aria-hidden="true"><option value="">全部外呼池</option></select><div data-control="native-外呼池" data-label="外呼池"></div></div><div class="field-wrap"><select id="native-线索批次" name="线索批次" hidden tabindex="-1" aria-hidden="true"><option value="">全部批次</option></select><div data-control="native-线索批次" data-label="线索批次"></div></div><button class="primary" type="submit">查看结果</button></form><p id="error" class="error" role="alert"></p></section>
<section class="overview" aria-labelledby="overview-title"><div class="section-head"><div><h2 id="overview-title">核心指标</h2></div><span id="count" class="muted"></span></div><div class="metrics" id="metrics"></div></section>
<section class="details" aria-labelledby="detail-title"><div class="section-head"><div><h2 id="detail-title">关联明细</h2></div></div><div class="table-wrap" tabindex="0" aria-label="关联明细表，可横向滚动"><table><thead><tr><th scope="col"><button type="button" class="sort-button" data-sort="日期" aria-label="按日期升序排列">日期<span aria-hidden="true">↕</span></button></th><th scope="col"><button type="button" class="sort-button" data-sort="学部" aria-label="按学部升序排列">学部<span aria-hidden="true">↕</span></button></th><th scope="col"><button type="button" class="sort-button" data-sort="流量期次" aria-label="按流量期次升序排列">流量期次<span aria-hidden="true">↕</span></button></th><th scope="col"><button type="button" class="sort-button" data-sort="外呼池" aria-label="按外呼池升序排列">外呼池<span aria-hidden="true">↕</span></button></th><th scope="col"><button type="button" class="sort-button" data-sort="线索批次" aria-label="按线索批次升序排列">线索批次<span aria-hidden="true">↕</span></button></th><th scope="col"><button type="button" class="sort-button" data-sort="状态" aria-label="按关联状态升序排列">关联状态<span aria-hidden="true">↕</span></button></th><th scope="col"><button type="button" class="sort-button" data-sort="经营例子量" aria-label="按例子量升序排列">例子量<span aria-hidden="true">↕</span></button></th><th scope="col"><button type="button" class="sort-button" data-sort="接通转化率" aria-label="按接通转化率升序排列">接通转化率<span aria-hidden="true">↕</span></button></th><th scope="col"><button type="button" class="sort-button" data-sort="有课例产" aria-label="按有课例产升序排列">有课例产<span aria-hidden="true">↕</span></button></th><th scope="col"><button type="button" class="sort-button" data-sort="单例子结算成本" aria-label="按单例子结算成本升序排列">单例子结算成本<span aria-hidden="true">↕</span></button></th><th scope="col"><button type="button" class="sort-button" data-sort="北A" aria-label="按北A升序排列">北A<span aria-hidden="true">↕</span></button></th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty" hidden>当前条件下没有数据。请调整筛选，或先通过命令行导入数据。</div><div class="pagination"><button id="prev" type="button">上一页</button><span id="page"></span><button id="next" type="button">下一页</button></div></section></main><footer>数据保存在本机 · 口径与关联范围请结合来源核对</footer></body></html>
